version: '3.9'

# Core Services - Always needed for basic functionality
# MongoDB: Main application database
# PostgreSQL (offline-fs): Operational database for transcripts
# MinIO: Object storage

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: quanmd
      MONGO_INITDB_ROOT_PASSWORD: quanmd
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network

  offline-fs:
    container_name: datalake-offline-fs
    image: postgres:11
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: quanmd
      POSTGRES_PASSWORD: quanmd
      POSTGRES_DB: k6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quanmd -d k6"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  minio:
    image: minio/minio
    container_name: datalake-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ACCESS_KEY: minio_access_key
      MINIO_SECRET_KEY: minio_secret_key
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network

volumes:
  mongo_data:
  minio_storage:

networks:
  rag-network:
    driver: bridge
